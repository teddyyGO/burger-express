# =============================================================================
#  CI - runs automatically on every push and every pull request.
#
#  Job 1: unit tests (fast, no Docker needed)
#  Job 2: end to end test (starts the whole system with Docker Compose)
#
#  Job 2 only runs if job 1 passed, so we do not start Docker if the rules
#  are already broken.
# =============================================================================
name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun test tests/unit

  e2e-test:
    name: End to end test
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start the whole system
        run: docker compose up -d --build

      - name: Wait until the public API answers
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/api/products > /dev/null; then
              echo "The system is up"
              exit 0
            fi
            echo "waiting... ($i/60)"
            sleep 2
          done
          echo "The system never started:"
          docker compose logs --no-color
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run the end to end test
        run: bun test tests/e2e

      - name: Show the docker logs if something failed
        if: failure()
        run: docker compose logs --no-color

      - name: Stop everything
        if: always()
        run: docker compose down -v
