# =============================================================================
#  nginx is the ONLY public entry point of the system (port 80).
#
#  It is also the only gateway. There is no extra api-gateway service behind
#  it, because that would just be a second gateway doing the same job.
#  nginx sends each /api path straight to the service that owns it:
#
#    /api/products      -> product-service
#    /api/orders        -> order-service
#    /api/kitchen       -> kitchen-service
#    /api/notifications -> notification-service
#
#  The services have no published ports, so this is the only way in.
# =============================================================================
server {
    listen 80;
    server_name _;

    # Do not advertise the nginx version, and keep request bodies small
    # (an order is a few hundred bytes).
    server_tokens off;
    client_max_body_size 16k;

    # Basic browser hardening for the test page.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # These headers are set once here instead of inside every location block.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # The services listen on the same /api paths, so we do not rewrite the url.
    location /api/products {
        proxy_pass http://product-service:3001;
    }

    location /api/orders {
        proxy_pass http://order-service:3002;
    }

    location /api/kitchen {
        proxy_pass http://kitchen-service:3003;
    }

    location /api/notifications {
        proxy_pass http://notification-service:3004;
    }

    # A small test page: the menu, an order form and the kitchen screen.
    # It calls /api/* on the same address, so there are no CORS problems.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
